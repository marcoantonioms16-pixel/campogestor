    const calcularTempoTrabalhado = (dataAdmissaoStr) => {
      const [dia, mes, ano] = dataAdmissaoStr.split('/').map(Number);
      const dataAdmissao = new Date(ano, mes - 1, dia);
      const hoje = new Date();

      let anos = hoje.getFullYear() - dataAdmissao.getFullYear();
      let meses = hoje.getMonth() - dataAdmissao.getMonth();
      let dias = hoje.getDate() - dataAdmissao.getDate();

      if (dias < 0) {
        meses -= 1;
        const ultimoDiaMesAnterior = new Date(hoje.getFullYear(), hoje.getMonth(), 0).getDate();
        dias += ultimoDiaMesAnterior;
      }

      if (meses < 0) {
        anos -= 1;
        meses += 12;
      }

      const partes = [];
      if (anos > 0) partes.push(`${anos} ${anos === 1 ? 'ano' : 'anos'}`);
      if (meses > 0) partes.push(`${meses} ${meses === 1 ? 'mês' : 'meses'}`);
      if (dias > 0) partes.push(`${dias} ${dias === 1 ? 'dia' : 'dias'}`);

      return partes.length > 0 ? partes.join(', ') : 'Admitido hoje';
    };

    function FuncionariosList() {
      const [abertoId, setAbertoId] = useState(null);

      const toggleAccordion = (id) => {
        setAbertoId(abertoId === id ? null : id);
      };

      return (
        <div style={styles.container}>
          <h2 style={styles.title}>Quadro de Funcionários</h2>

          {funcionariosData.map((f) => {
            const isExpanded = abertoId === f.id;
            const tempoTrabalhado = calcularTempoTrabalhado(f.admissao);

            return (
              <div key={f.id} style={styles.card}>
                <div style={styles.header} onClick={() => toggleAccordion(f.id)}>
                  <div>
                    <h3 style={styles.nome}>{f.nome}</h3>
                    <span style={styles.cargo}>{f.cargo}</span>
                  </div>
                  <span style={styles.arrow}>{isExpanded ? '▲' : '▼'}</span>
                </div>

                {isExpanded && (
                  <div style={styles.details}>
                    <div style={styles.row}>
                      <strong>CPF:</strong> <span>{f.cpf}</span>
                    </div>
                    <div style={styles.row}>
                      <strong>Data de Nascimento:</strong> <span>{f.nascimento}</span>
                    </div>
                    <div style={styles.row}>
                      <strong>Data de Admissão:</strong> <span>{f.admissao}</span>
                    </div>
                    <div style={styles.row}>
                      <strong>Tempo de Empresa:</strong> <span style={styles.highlight}>{tempoTrabalhado}</span>
                    </div>
                    <div style={styles.row}>
                      <strong>Plano de Saúde (Unimed):</strong>{' '}
                      <span>{f.planoSaude ? f.planoSaude : 'Não cadastrado'}</span>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    const styles = {
      container: { maxWidth: '600px', margin: '0 auto', padding: '16px', fontFamily: 'Arial, sans-serif' },
      title: { color: '#fff', marginBottom: '20px', textAlign: 'center' },
      card: { backgroundColor: '#1e293b', color: '#fff', borderRadius: '8px', marginBottom: '12px', overflow: 'hidden', boxShadow: '0 2px 4px rgba(0,0,0,0.2)' },
      header: { padding: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer', backgroundColor: '#0f172a' },
      nome: { margin: 0, fontSize: '16px', color: '#38bdf8' },
      cargo: { fontSize: '12px', color: '#94a3b8' },
      arrow: { fontSize: '14px', color: '#94a3b8' },
      details: { padding: '16px', borderTop: '1px solid #334155', backgroundColor: '#1e293b' },
      row: { display: 'flex', justifyContent: 'space-between', marginBottom: '8px', fontSize: '14px' },
      highlight: { color: '#4ade80', fontWeight: 'bold' }
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FuncionariosList />);
  </script>
