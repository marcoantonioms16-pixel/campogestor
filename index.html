<head>

<style>
:root{--bg:#121a14;--surface:#1c261f;--elevated:#27332a;--fg:#f4f7f2;--muted:#a8b5a4;--subtle:#7d8c78;--primary:#8fcf7a;--primary-soft:#b5e0a6;--border:#334038;--ok:#9fd48a;--warn:#d4b36a;--danger:#d47a6a;--font:Figtree,system-ui,sans-serif;--display:Fraunces,Georgia,serif;--radius:14px}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0}
.app{max-width:720px;margin:0 auto;min-height:100dvh;padding-bottom:1.5rem}
.header{padding:1.25rem 1rem .5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.header .kicker{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.header h1{font-size:1.5rem;margin-top:.15rem}.sub{padding:0 1rem;font-size:.875rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:.75rem 1rem}
.card-title{font-size:.875rem;font-weight:500;margin:0 0 .5rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.muted{color:var(--muted);font-size:.8rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:none}
.badge{display:inline-flex;border-radius:999px;padding:.15rem .55rem;font-size:.7rem;font-weight:500}
.badge.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.badge.muted{background:var(--elevated);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border:1px solid var(--border);background:var(--elevated);color:var(--fg);border-radius:10px;padding:.5rem .85rem;font-size:.85rem;font-weight:500}
.btn.primary{background:var(--primary);color:var(--bg);border-color:transparent}
.btn.block{width:100%}.btn.sm{padding:.3rem .55rem;font-size:.75rem}.btn.icon{width:2.2rem;height:2.2rem;padding:0}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem}
.field label{font-size:.75rem;color:var(--muted)}
.field input,.field select{background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:.55rem .7rem}
.search{margin:.5rem 1rem}
.search input{width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:.65rem .85rem}
.progress{height:6px;background:var(--elevated);border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--primary)}
.check{display:flex;align-items:flex-start;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.check:last-child{border-bottom:none}.check input{margin-top:.2rem;accent-color:var(--primary)}
.check.done .titulo{text-decoration:line-through;color:var(--muted)}
.menu-btn{background:var(--elevated);border:1px solid var(--border);color:var(--fg);width:2.55rem;height:2.55rem;border-radius:12px;font-size:1.25rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-btn:active{transform:scale(.96)}
.side-bg{position:fixed;inset:0;background:rgb(8 12 9 / .55);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s ease}
.side-bg.open{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;left:0;bottom:0;width:min(82vw,300px);background:var(--surface);border-right:1px solid var(--border);z-index:80;transform:translateX(-105%);transition:transform .25s ease;padding:1rem .75rem 1.5rem;display:flex;flex-direction:column;gap:.25rem;box-shadow:8px 0 32px rgb(0 0 0 / .35)}
.side.open{transform:translateX(0)}
.side .brand{padding:.5rem .65rem 1rem;border-bottom:1px solid var(--border);margin-bottom:.5rem}
.side .brand .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.side .brand .n{font-family:var(--display);font-size:1.15rem;margin-top:.2rem}
.side button.nav-item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.7rem .75rem;border:none;background:transparent;color:var(--fg);border-radius:12px;font-size:.92rem;font-weight:500}
.side button.nav-item span.ic{width:1.5rem;text-align:center;opacity:.9}
.side button.nav-item.active{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary-soft)}
.side button.nav-item:active{background:var(--elevated)}
.ring-wrap{display:flex;align-items:center;gap:1rem;margin:.75rem 1rem}
.ring{width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%), var(--elevated) 0);display:grid;place-items:center;flex-shrink:0;position:relative}
.ring::after{content:"";position:absolute;inset:7px;background:var(--surface);border-radius:50%;border:1px solid var(--border)}
.ring .pct{position:relative;z-index:1;font-family:var(--display);font-size:1.05rem;font-weight:500}
.ring-meta .big{font-size:.95rem;font-weight:500}
.header{align-items:center}
.check.done{display:none!important}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.75rem 1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem}
.stat .lbl{font-size:.7rem;color:var(--muted)}.stat .val{font-size:.95rem;font-weight:500;margin-top:.2rem}
.drawer-bg{position:fixed;inset:0;background:rgb(12 16 11 / .72);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.drawer{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:88dvh;overflow:auto;padding:1.15rem 1rem 1.4rem}
.drawer h2{margin-bottom:.85rem;font-size:1.1rem}
.chips{display:flex;gap:.35rem;overflow-x:auto;padding:.4rem 1rem}
.chip{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.3rem .7rem;font-size:.72rem;color:var(--muted)}
.chip.on{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary);border-color:transparent}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--elevated);border:1px solid var(--border);padding:.55rem 1rem;border-radius:999px;font-size:.85rem;z-index:100}
.hidden{display:none!important}
.table{width:100%;border-collapse:collapse;font-size:.8rem}
.table th,.table td{text-align:left;padding:.4rem .3rem;border-bottom:1px solid var(--border);vertical-align:top}
.table th{color:var(--muted);font-weight:500}
.sec{margin:.75rem 1rem;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
</style>
</head>

const SB_AUTH_KEY = "cg-sb-session";

function sbHeaders(token) {
  const h = {
    "apikey": SB_KEY,
    "Content-Type": "application/json",
  };
  if (token) h["Authorization"] = "Bearer " + token;
  else h["Authorization"] = "Bearer " + SB_KEY;
  return h;
}

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SB_AUTH_KEY) || "null"); } catch(e) { return null; }
}
function saveSession(sess) {
  if (sess) localStorage.setItem(SB_AUTH_KEY, JSON.stringify(sess));
  else localStorage.removeItem(SB_AUTH_KEY);
}

async function sbSignup(email, password) {
  const res = await fetch(SB_URL + "/auth/v1/signup", {
    method: "POST",
    headers: sbHeaders(),
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || data.error || data.message || ("Erro " + res.status));
  if (data.access_token) {
    saveSession(data);
    sbUser = data.user;
  } else if (data.user) {
    // email confirmation required — try login anyway or inform
    sbUser = data.user;
    if (data.session && data.session.access_token) {
      saveSession(data.session);
    }
  }
  return data;
}

async function sbLogin(email, password) {
  const res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: sbHeaders(),
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error_description || data.msg || data.error || data.message || ("Erro " + res.status);
    if (String(msg).toLowerCase().includes("confirm") || String(msg).toLowerCase().includes("email")) {
      throw new Error("E-mail ainda não confirmado. No Supabase: Authentication → Users → confirme o usuário, ou desligue Confirm email.");
    }
    throw new Error(msg);
  }
  saveSession(data);
  sbUser = data.user;
  await pullCloud();
  cloudStatus = "synced";
  await pushCloud();
  return data;
}

async function sbLogout() {
  const sess = loadSession();
  if (sess && sess.access_token) {
    try {
      await fetch(SB_URL + "/auth/v1/logout", { method: "POST", headers: sbHeaders(sess.access_token) });
    } catch(e) {}
  }
  saveSession(null);
  sbUser = null;
  cloudStatus = "local";
}

async function initAuth() {
  const sess = loadSession();
  if (!sess || !sess.access_token) return;
  // validate session
  try {
    const res = await fetch(SB_URL + "/auth/v1/user", { headers: sbHeaders(sess.access_token) });
    if (!res.ok) { saveSession(null); return; }
    const user = await res.json();
    sbUser = user;
    await pullCloud();
  } catch(e) {
    console.warn(e);
  }
}

async function pushCloud() {
  if (!sbUser) return;
  const sess = loadSession();
  if (!sess || !sess.access_token) return;
  try {
    cloudStatus = "syncing";
    const payload = { user_id: sbUser.id, data: state, updated_at: new Date().toISOString() };
    const res = await fetch(SB_URL + "/rest/v1/app_state?on_conflict=user_id", {
      method: "POST",
      headers: Object.assign(sbHeaders(sess.access_token), {
        "Prefer": "resolution=merge-duplicates,return=minimal",
      }),
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(t || ("HTTP " + res.status));
    }
    cloudStatus = "synced";
  } catch(e) {
    console.warn("cloud save", e);
    cloudStatus = "error";
    cloudError = (e && e.message) ? e.message : String(e);
  }
  const el = document.getElementById("cloud-status");
  if (el) el.textContent = cloudLabel();
}

async function pullCloud() {
  if (!sbUser) return false;
  const sess = loadSession();
  if (!sess || !sess.access_token) return false;
  try {
    const res = await fetch(SB_URL + "/rest/v1/app_state?user_id=eq." + encodeURIComponent(sbUser.id) + "&select=data,updated_at", {
      headers: sbHeaders(sess.access_token),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    if (rows && rows[0] && rows[0].data) {
      const data = rows[0].data;
      state = {
        ...JSON.parse(JSON.stringify(SEED)),
        ...data,
        farm: { ...SEED.farm, ...(data.farm || {}) },
        diesel: { ...SEED.diesel, ...(data.diesel || {}) },
      };
      if (!state.sementes) state.sementes = [];
      if (!state.folgas) state.folgas = [];
      if (!state.equatorial) state.equatorial = SEED.equatorial;
      localStorage.setItem(KEY, JSON.stringify(state));
      cloudStatus = "synced";
      return true;
    }
  } catch(e) {
    console.warn("cloud pull", e);
    cloudStatus = "error";
    cloudError = (e && e.message) ? e.message : String(e);
  }
  return false;
}

function hojeISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function diaSemana(ref){ return new Date(ref+"T12:00:00").getDay(); }
function diaDoMes(ref){ return new Date(ref+"T12:00:00").getDate(); }
function ultimoDiaMes(ref){ const d=new Date(ref+"T12:00:00"); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function isSegunda(ref){ return diaSemana(ref)===1; }
function isSexta(ref){ return diaSemana(ref)===5; }
function isInicioMes(ref){ return diaDoMes(ref)<=5; }
function isDia30(ref){ const d=diaDoMes(ref), u=ultimoDiaMes(ref); return d===30 || (u<30 && d===u); }
function isFolgas(ref){ const d=diaDoMes(ref); return d>=20 && d<=25; }
function isFimMes(ref){ const d=diaDoMes(ref), u=ultimoDiaMes(ref); return d>=u-3; }
function rotinaHoje(ref){
  const list=[];
  // diários sempre
  list.push(...ROTINA.filter(r=>r.freq==="diario"));
  if(isSegunda(ref)) list.push(...ROTINA.filter(r=>r.freq==="segunda"));
  if(isSexta(ref)) list.push(...ROTINA.filter(r=>r.freq==="sexta"));
  if(isInicioMes(ref)) list.push(...ROTINA.filter(r=>r.freq==="inicio_mes"));
  if(isDia30(ref)) list.push(...ROTINA.filter(r=>r.freq==="dia30"));
  if(isFolgas(ref)) list.push(...ROTINA.filter(r=>r.freq==="folgas"));
  if(isFimMes(ref)) list.push(...ROTINA.filter(r=>r.freq==="fim_mes"));
  return list;
}

function progressoHoje(ref){
  const list = rotinaHoje(ref);
  if(!list.length) return {total:0,done:0,pct:0};
  const done = list.filter(r => state.rotinaFeita[r.id]===ref).length;
  const pct = Math.round((done/list.length)*100);
  return {total:list.length, done, pct};
}

function rotinaLegenda(ref){
  const parts=["Diário"];
  if(isSegunda(ref)) parts.push("Segunda");
  if(isSexta(ref)) parts.push("Sexta · diaristas ≤8:30");
  if(isInicioMes(ref)) parts.push("Início do mês");
  if(isDia30(ref)) parts.push("Dia 30 · compras");
  if(isFolgas(ref)) parts.push("Folgas (até dia 25)");
  if(isFimMes(ref)) parts.push("Final do mês");
  return "Lembretes de hoje: "+parts.join(" · ");
}
function proximosLembretes(ref){
  const d=new Date(ref+"T12:00:00");
  const avisos=[];
  // look ahead 7 days for special
  for(let i=1;i<=7;i++){
    const x=new Date(d); x.setDate(d.getDate()+i);
    const iso=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
    const labels=[];
    if(isSegunda(iso)) labels.push("insumos + EPIs");
    if(isSexta(iso)) labels.push("diaristas");
    if(isDia30(iso)) labels.push("compras cantina/alojamento");
    if(isFolgas(iso) && diaDoMes(iso)===20) labels.push("iniciar fechamento de folgas");
    if(isFimMes(iso) && diaDoMes(iso)===ultimoDiaMes(iso)-3) labels.push("relatório abastecimento + refeições");
    if(isInicioMes(iso) && diaDoMes(iso)===1) labels.push("holerites");
    if(labels.length) avisos.push({iso, labels:labels.join(", ")});
  }
  return avisos;
}

function n(v,d=1){ return Number(v).toLocaleString("pt-BR",{maximumFractionDigits:d}); }
function ha(v){ return n(v, v>=100?0:1)+" ha"; }
function dataLonga(iso){ const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}); }
function dataNascimentoFmt(iso){ const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"long"}); }
function mesDia(iso){ return iso.slice(5,10); }
function aniversarioHoje(nasc, ref){ return nasc && mesDia(nasc)===mesDia(ref); }
function aniversarioEmAte(nasc, dias, ref){
  if(!nasc) return false;
  const base=new Date(ref+"T12:00:00");
  for(let i=0;i<=dias;i++){ const d=new Date(base); d.setDate(base.getDate()+i);
    const md=String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(mesDia(nasc)===md) return true; }
  return false;
}
function idadeEm(nasc, ref){ const n0=new Date(nasc+"T12:00:00"), r=new Date(ref+"T12:00:00"); let idade=r.getFullYear()-n0.getFullYear(); const m=r.getMonth()-n0.getMonth(); if(m<0||(m===0&&r.getDate()<n0.getDate())) idade--; return idade; }
function tempoDeCasa(admissao, ref){
  if(!admissao) return null;
  const a=new Date(admissao+"T12:00:00"), r=new Date(ref+"T12:00:00");
  if(r < a) return "Recém-admitido";
  let anos = r.getFullYear() - a.getFullYear();
  let meses = r.getMonth() - a.getMonth();
  if(r.getDate() < a.getDate()) meses--;
  if(meses < 0){ anos--; meses += 12; }
  const partes=[];
  if(anos > 0) partes.push(anos + (anos===1?" ano":" anos"));
  if(meses > 0) partes.push(meses + (meses===1?" mês":" meses"));
  if(!partes.length){
    const dias = Math.floor((r - a) / 86400000);
    return dias <= 1 ? "1 dia" : dias + " dias";
  }
  return partes.join(" e ");
}
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function exportCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>{
    const s=String(c??"");
    return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\n");
  const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  toast("Arquivo gerado: "+filename);
}

  const msgs=[];

  if(isSegunda(hoje)) msgs.push("Segunda: contagem de insumos e solicitação de EPIs.");
  if(isDia30(hoje)) msgs.push("Dia 30: solicitar compras de cantina, alojamento e escritório.");
  if(isFolgas(hoje) && diaDoMes(hoje)>=23) msgs.push("Fechar controle de folgas até o dia 25.");
  if(isFimMes(hoje)) msgs.push("Final do mês: relatório de abastecimento e controle de refeições.");

    new Notification("CampoGestor — lembrete", {body: msgs.join(" "), tag:key});

  }catch(e){}

      <div class="field"><label>Data</label><input id="e-data" type="date" value="${esc(c.data||hojeISO())}"/></div>
      <div class="field"><label>Milímetros (mm)</label><input id="e-mm" inputmode="decimal" value="${esc(c.mm??"")}"/></div>
      <div class="field"><label>Observação</label><input id="e-obs" value="${esc(c.obs||"")}"/></div>
      <button class="btn primary block" id="e-save">Salvar</button>
      ${edit.kind==="chuva"?`<button class="btn block" id="e-del" style="margin-top:.5rem;color:var(--danger)">Excluir</button>`:""}`;
  }
  if(edit.kind==="saida" || edit.kind==="novo-saida"){
    const prodOpts = state.insumos.map(i=>`<option value="${i.id}">${esc(i.nome)} (${n(i.quantidade,i.quantidade>=100?0:1)} ${esc(i.unidade)})</option>`).join("");
    body=`<h2>Lançamento de saída</h2>
      <div class="field"><label>Data</label><input id="e-data" type="date" value="${hojeISO()}"/></div>
      <div class="field"><label>Tipo de saída</label><select id="e-tipo">
        <option value="Aplicação">Aplicação</option>
        <option value="Transferência">Transferência</option>
        <option value="Empréstimo">Empréstimo</option>
        <option value="Baixa">Baixa</option>
      </select></div>
      <div class="field"><label>Produto</label><select id="e-prod">${prodOpts}</select></div>
      <div class="field"><label>Quantidade</label><input id="e-qtd" inputmode="decimal" value=""/></div>
      <div class="field"><label>Destino (transferência / empréstimo)</label><input id="e-destino" placeholder="Opcional"/></div>
      <div class="field"><label>Responsável</label><input id="e-resp" placeholder="Opcional"/></div>
      <div class="field"><label>Observação</label><input id="e-obs" placeholder="Opcional"/></div>
      <button class="btn primary block" id="e-save">Salvar e dar baixa</button>`;
  }
  if(edit.kind==="farm"){
    body=`<h2>Editar fazenda</h2>
      <div class="field"><label>Nome</label><input id="f-nome" value="${esc(state.farm.nome)}"/></div>
      <div class="field"><label>Local</label><input id="f-mun" value="${esc(state.farm.municipio)}"/></div>
      <div class="field"><label>Cargo</label><input id="f-cargo" value="${esc(state.farm.cargo)}"/></div>
      <div class="field"><label>Gerente</label><input id="f-ger" value="${esc(state.farm.gerente)}"/></div>
      <div class="field"><label>Safra</label><input id="f-safra" value="${esc(state.farm.safra)}"/></div>
      <button class="btn primary block" id="e-save-farm">Salvar</button>`;
  }
  return `<div class="drawer-bg" id="drawer"><div class="drawer">${body}</div></div>`;
}

function render(){
  const root=document.getElementById("app");
  const hoje=hojeISO();
  let html="";

  if(page==="hoje"){
    const listaRotina=rotinaHoje(hoje);

    const ultimaChuva = chuvaLista[0];
    html+=headerBar(
      `${esc(state.farm.cargo)} · <span id="cloud-status">${cloudLabel()}</span>`,
      esc(state.farm.nome)
    );
    // Card Propriedade
    html+=`<div class="card">
      <p class="muted" style="text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;margin:0">Propriedade</p>
      <p style="font-family:var(--display);font-size:1.2rem;margin:.2rem 0">${esc(state.farm.nome)}</p>
      <p class="muted">${esc(state.farm.municipio)} · safra ${esc(state.farm.safra)} · ${n(state.farm.areaTotal,0)} ha</p>
      <p class="muted" style="margin-top:.35rem">Gerente: ${esc(state.farm.gerente)}</p>
      <p class="muted">Auxiliar administrativo: Marcos Antonio da Silva Morais</p>
      <button class="btn sm" style="margin-top:.6rem" data-edit="farm">Editar fazenda</button>
    </div>`;
    // Bloco resumo
    html+=`<div class="grid2">
      <div class="stat"><div class="lbl">Diesel</div><div class="val">${n(state.diesel.litros,0)} L</div><div class="muted">${dieselPct}% do tanque</div></div>
      <div class="stat"><div class="lbl">Última chuva</div><div class="val">${ultimaChuva ? n(ultimaChuva.mm,1)+" mm" : "—"}</div><div class="muted">${ultimaChuva ? (ultimaChuva.data||"").split("-").reverse().join("/") : "sem registro"}</div></div>
      <div class="stat"><div class="lbl">Equipe</div><div class="val">${state.pessoas.length}</div><div class="muted">colaboradores</div></div>
      <div class="stat"><div class="lbl">Área</div><div class="val">${n(state.farm.areaTotal,0)} ha</div><div class="muted">${state.talhoes.length} talhões</div></div>
    </div>`;
    // Atividades do dia
    html+=`<div class="ring-wrap">
      <div class="ring" style="--p:${pct}"><span class="pct">${pct}%</span></div>
      <div class="ring-meta">
        <div class="big">Tarefas de hoje</div>
        <div class="muted">${feitas} de ${listaRotina.length} concluídas</div>
        <div class="muted">${esc(rotinaLegenda(hoje))}</div>
      </div>
    </div>`;
    html+=`<p class="sub">${dataLonga(hoje)}</p>`;
    if(niverHoje.length){
      html+=`<div class="card" style="border-color:var(--primary)"><p class="card-title">🎂 Aniversário hoje — avise o gerente</p><ul class="list">`;
      niverHoje.forEach(p=>{ html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(p.nome)}</div><div class="muted">${esc(p.funcao)} · completa ${idadeEm(p.nascimento,hoje)+1} anos</div></div><span class="badge ok">Hoje</span></li>`; });
      html+=`</ul><p class="muted" style="margin-top:.5rem">Lembrete para ${esc(state.farm.gerente)}</p></div>`;
    }
    if(niver7.length){
      html+=`<div class="card"><p class="card-title">Próximos aniversários (7 dias)</p><ul class="list">`;
      niver7.forEach(p=>{ html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(p.nome)}</div><div class="muted">${esc(p.funcao)} · ${dataNascimentoFmt(p.nascimento)}</div></div><span class="badge warn">Em breve</span></li>`; });
      html+=`</ul></div>`;
    }
    html+=`<div class="card"><p class="card-title">Lembretes</p><p class="muted" style="margin-bottom:.6rem">${rotinaLegenda(hoje)}</p>`;
    if(!listaRotina.length){
      html+=`<p class="muted">Nada obrigatório hoje. Na <b>segunda</b>: frota, estoque e aniversariantes. Na <b>sexta antes das 8:30</b>: diaristas. No <b>final do mês</b>: inventário e fechamentos.</p>`;
    } else {
      const pendentes=listaRotina.filter(r=>state.rotinaFeita[r.id]!==hoje);
      if(!pendentes.length){
        html+=`<p style="color:var(--ok);font-weight:500;margin:.35rem 0">Tudo concluído por hoje ✓</p><p class="muted">As tarefas voltam amanhã.</p>`;
      } else {
        html+=`<p class="muted" style="margin:0 0 .5rem">${pendentes.length} pendente(s) · marque para concluir</p>`;
        pendentes.forEach(r=>{
          html+=`<label class="check"><input type="checkbox" data-rotina="${r.id}"/><span><span class="titulo" style="display:block;font-size:.9rem">${esc(r.titulo)}</span><span class="muted">${esc(r.grupo)}</span></span></label>`;
        });
      }
    }
    const prox=proximosLembretes(hoje);
    if(prox.length){
      html+=`<div class="card"><p class="card-title">Próximos dias</p><ul class="list">`;
      prox.forEach(p=>{ html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(p.iso.split("-").reverse().join("/"))}</div><div class="muted">${esc(p.labels)}</div></div></li>`; });
      html+=`</ul></div>`;
    }
    html+=`<div class="card"><p class="card-title">Quando ocorrer (marque se fez)</p>`;
    ROTINA.filter(r=>r.freq==="evento").forEach(r=>{
      const done=state.rotinaFeita[r.id]===hoje;
      html+=`<label class="check ${done?"done":""}"><input type="checkbox" ${done?"checked":""} data-rotina="${r.id}"/><span><span class="titulo" style="display:block;font-size:.9rem">${esc(r.titulo)}</span><span class="muted">${esc(r.grupo)}</span></span></label>`;
    });
    html+=`</div>`;
  }

  if(page==="frota"){
    html+=headerBar("Máquinas","Frota",`<button class="btn primary sm" data-new="maquina">+ Nova</button>`);
    const dieselPct=Math.round((state.diesel.litros/state.diesel.capacidade)*100);
    html+=`<div class="card"><div class="row"><p class="card-title">Tanque de diesel</p><span class="muted">${dieselPct}%</span></div><div class="progress"><span style="width:${dieselPct}%"></span></div><p class="muted" style="margin-top:.5rem">${n(state.diesel.litros,0)} L de ${n(state.diesel.capacidade,0)} L</p></div>`;
    html+=`<ul class="list card" style="padding:.25rem 1rem">`;
    state.maquinas.forEach(m=>{
      const tone=m.status==="operando"?"ok":m.status==="manutencao"?"warn":"muted";
      const label=m.status==="operando"?"Operando":m.status==="manutencao"?"Manutenção":"Parada";
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(m.nome)}</div><div class="muted">${TIPO_MAQ[m.tipo]||m.tipo} · ${esc(m.modelo)}${m.placa?" · "+esc(m.placa):""}</div></div>
        <span class="badge ${tone}">${label}</span>
        <button class="btn sm" data-edit="maquina" data-id="${m.id}">✎</button></li>`;
    });
    html+=`</ul>`;
  }

  if(page==="estoque"){
    const lista = state.insumos.filter(i=>{
      const okQ = !qInsumo || i.nome.toLowerCase().includes(qInsumo.toLowerCase());
      const okC = catInsumo==="todos" || i.categoria===catInsumo;
      return okQ && okC;
    }).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
    html+=headerBar(`Almoxarifado · ${state.insumos.length} itens`,"Estoque",`<button class="btn primary sm" data-new="insumo">+ Novo</button>`);
    html+=`<div style="padding:.25rem 1rem"><button class="btn block" data-new="saida">Lançamento de saída</button></div>`;
    html+=`<div class="search"><input id="q-insumo" placeholder="Pesquisar insumo..." value="${esc(qInsumo)}"/></div>`;
    html+=`<div class="chips"><button class="chip ${catInsumo==="todos"?"on":""}" data-cat="todos">Todos</button>`;
    CATS.forEach(c=>{ html+=`<button class="chip ${catInsumo===c?"on":""}" data-cat="${c}">${CAT[c]}</button>`; });
    html+=`</div>`;
    html+=`<ul class="list card" style="padding:.25rem 1rem">`;
    if(!lista.length) html+=`<li class="muted">Nenhum insumo encontrado.</li>`;
    lista.forEach(i=>{
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(i.nome)}</div>
        <div class="muted">${esc(i.tipoDef||CAT[i.categoria]||"")} · ${esc(i.tecnico||"—")}</div></div>
        <div style="text-align:right"><div style="font-weight:500">${n(i.quantidade,i.quantidade>=100?0:1)} ${esc(i.unidade)}</div></div>
        <button class="btn sm" data-edit="insumo" data-id="${i.id}">✎</button></li>`;
    });
    html+=`</ul>`;
    // Histórico de saídas
    const saidas = (state.saidas||[]).slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")).slice(0,30);
    if(saidas.length){
      html+=`<p class="sec">Histórico de saídas</p><ul class="list card" style="padding:.25rem 1rem">`;
      saidas.forEach(s=>{
        const produtos = (s.itens||[]).map(it=>`${it.nome} (${it.qtd} ${it.un||""})`).join(", ");
        html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(s.tipo)} · ${(s.data||"").split("-").reverse().join("/")}</div>
          <div class="muted">${esc(produtos)}${s.destino?" · "+esc(s.destino):""}${s.obs?" · "+esc(s.obs):""}</div>
          ${s.tipo==="Empréstimo" && !s.devolvido?`<button class="btn sm" style="margin-top:.3rem" data-devolver="${s.id}">Devolvido</button>`:""}
          ${s.devolvido?'<span class="badge ok">Devolvido</span>':""}
        </div></li>`;
      });
      html+=`</ul>`;
    }
  }

  if(page==="pessoas"){
    const selPessoa = edit && edit.kind==="ver-pessoa" ? state.pessoas.find(x=>x.id===edit.id) : null;
    if(selPessoa){
      const p = selPessoa;
      const tempo = tempoDeCasa(p.admissao, hoje);
      html+=headerBar("Detalhes","Pessoa",`<button class="btn sm" data-go="pessoas">← Voltar</button>`);
      html+=`<div class="card">
        <p style="font-family:var(--display);font-size:1.25rem;margin:0 0 .5rem">${esc(p.nome)}</p>
        <p class="muted">${esc(p.funcao)} · ${esc(p.tipo)}</p>
        ${p.nascimento?`<p class="muted" style="margin-top:.4rem">Aniversário: ${dataNascimentoFmt(p.nascimento)}</p>`:""}
        ${p.admissao?`<p class="muted">Admissão: ${String(p.admissao).split("-").reverse().join("/")}</p>`:""}
        ${tempo?`<p style="margin-top:.5rem;font-weight:500">Tempo de casa: ${esc(tempo)}</p>`:""}
        ${p.carteira?`<div style="margin-top:.75rem;padding:.6rem;background:var(--elevated);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:.5rem">
          <div><div class="muted" style="font-size:.7rem">Carteira Unimed</div><div style="font-weight:500;font-size:.9rem">${esc(p.carteira)}</div></div>
          <button class="btn sm" data-copy="${esc(p.carteira)}">Copiar</button>
        </div>`:`<p class="muted" style="margin-top:.5rem">Sem carteira cadastrada</p>`}
        <button class="btn" style="margin-top:1rem" data-edit="pessoa" data-id="${p.id}">✎ Editar dados</button>
      </div>`;
    } else {
      html+=headerBar(`Equipe · ${state.pessoas.length}`,"Pessoas",`<button class="btn primary sm" data-new="pessoa">+ Nova</button>`);
      html+=`<div style="padding:.5rem 1rem"><button class="btn block" id="btn-notif">Ativar avisos de aniversário</button></div>`;
      html+=`<ul class="list card" style="padding:.25rem 1rem">`;
      const ord=[...state.pessoas].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
      ord.forEach(p=>{
        const hojeN=aniversarioHoje(p.nascimento,hoje);
        html+=`<li style="cursor:pointer" data-ver-pessoa="${p.id}">
          <div style="flex:1"><div style="font-weight:500">${esc(p.nome)}</div>
          ${hojeN?'<div class="muted">🎂 Aniversário hoje</div>':''}
          </div>
          ${hojeN?'<span class="badge ok">Hoje</span>':''}
        </li>`;
      });
      html+=`</ul>`;
    }
  }

  if(page==="safra"){
    html+=headerBar("Caderno de campo","Safra 2026/27",``);
    html+=`<p class="sub">Programação · Grupo Segredo · Fazenda Santa Rita</p>`;
    html+=`<p class="sec">Corretivo (calcário)</p><div class="card" style="padding:.5rem .75rem;overflow:auto"><table class="table"><tr><th>Talhões</th><th>ha</th><th>Cultivar</th><th>Dose</th><th>Volume</th></tr>`;
    SAFRA.corretivo.forEach(r=>{ html+=`<tr><td>${esc(r.talhoes)}</td><td>${n(r.ha,2)}</td><td>${esc(r.cultivar)}</td><td>${esc(r.dose)}</td><td>${esc(r.volume)}</td></tr>`; });
    html+=`</table></div>`;
    html+=`<p class="sec">Fertilizante</p>`;
    SAFRA.fertilizante.forEach(g=>{
      html+=`<div class="card"><p class="card-title">${esc(g.talhoes)} · ${n(g.ha,2)} ha · ${esc(g.cultivar)}</p><ul class="list">`;
      g.itens.forEach(it=>{ html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(it.insumo)}</div><div class="muted">${esc(it.dose)}</div></div><div class="muted">${esc(it.volume)}</div></li>`; });
      html+=`</ul></div>`;
    });
    html+=`<p class="sec">Plantio soja</p><div class="card" style="padding:.5rem .75rem;overflow:auto"><table class="table"><tr><th>Talhões</th><th>ha</th><th>Cultivar</th><th>Sem/m</th><th>Esp.</th><th>Sem/ha</th></tr>`;
    SAFRA.plantio.forEach(r=>{ html+=`<tr><td>${esc(r.talhoes)}</td><td>${n(r.ha,2)}</td><td>${esc(r.cultivar)}</td><td>${esc(r.sem_m)}</td><td>${esc(r.espac)}</td><td>${esc(r.sem_ha)}</td></tr>`; });
    html+=`</table><p class="muted" style="margin-top:.5rem">Total plantio ≈ 1.587,11 ha</p></div>`;
    html+=`<p class="sec">Manejo de sulco (todos os talhões)</p><div class="card"><ul class="list">`;
    SAFRA.sulco.forEach(s=>{ html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(s.insumo)}</div><div class="muted">${esc(s.tipo)} · ${esc(s.fabricante)}</div></div><div class="muted">${esc(s.dose)}</div></li>`; });
    html+=`</ul></div>`;
    html+=`<p class="sec">Talhões cadastrados</p><ul class="list card" style="padding:.25rem 1rem">`;
    state.talhoes.forEach(t=>{
      const tag=t.fazenda==="campo-alegre"?"C. Alegre":"Sta Rita";
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(t.codigo)} · ${esc(t.nome)}</div><div class="muted">${ha(t.area)} · ${esc(t.variedade||"")} · ${tag}</div></div></li>`;
    });
    html+=`</ul>`;
  }


  if(page==="sementes"){
    const cults=["76KA72 CE","RAPTOR I2X","NEO761 I2X","NEO700 I2X","DM 72IX74 I2X","ST 752 I2X"];
    if(!state.sementes) state.sementes=[];
    const resumo={};
    cults.forEach(c=>resumo[c]={qtd:0,peso:0});
    state.sementes.forEach(s=>{
      if(!resumo[s.cultivar]) resumo[s.cultivar]={qtd:0,peso:0};
      resumo[s.cultivar].qtd++; resumo[s.cultivar].peso+=Number(s.peso)||0;
    });
    html+=headerBar("Conferência de big bags","Sementes soja",`<button class="btn primary sm" data-new="semente">+ Registrar</button>`);
    html+=`<p class="sub">Safra 2026/27 · tire foto da etiqueta e confira os dados no formulário (ou envie a foto no chat do Grok para extrair).</p>`;
    html+=`<div class="card"><p class="card-title">Resumo por cultivar</p><ul class="list">`;
    cults.forEach(c=>{
      const r=resumo[c];
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(c)}</div><div class="muted">${r.qtd} big bag(s)</div></div><div class="muted">${n(r.peso,0)} kg</div></li>`;
    });
    html+=`</ul><p class="muted" style="margin-top:.5rem">Total: ${state.sementes.length} registros</p></div>`;
    html+=`<p class="sec">Últimas conferências</p><ul class="list card" style="padding:.25rem 1rem">`;
    const lista=[...state.sementes].reverse().slice(0,40);
    if(!lista.length) html+=`<li class="muted">Nenhum big bag registrado ainda.</li>`;
    lista.forEach(s=>{
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(s.cultivar)}</div><div class="muted">Lote ${esc(s.lote||"—")} · ${esc(s.peso||"—")} kg · ${esc(s.fornecedor||"—")}</div><div class="muted">${esc(s.data||"")} · Bag ${esc(s.numero||"—")}${s.validade?" · val. "+esc(s.validade):""}</div></div>
        <button class="btn sm" data-edit="semente" data-id="${s.id}">✎</button></li>`;
    });
    html+=`</ul>`;
  }

  if(page==="chuva"){
    if(!state.chuva) state.chuva=[];
    const lista=[...state.chuva].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    html+=headerBar("Pluviometria","Chuva",`<button class="btn primary sm" data-new="chuva">+ Registrar</button>`);
    html+=`<p class="sub">Registre a data e os milímetros. O mais recente aparece na tela principal.</p>`;
    if(lista.length){
      const u=lista[0];
      html+=`<div class="card"><p class="card-title">Última chuva</p>
        <p style="font-size:1.4rem;font-weight:500;margin:.2rem 0">${n(u.mm,1)} mm</p>
        <p class="muted">${(u.data||"").split("-").reverse().join("/")}${u.obs?" · "+esc(u.obs):""}</p></div>`;
    }
    html+=`<p class="sec">Histórico</p><ul class="list card" style="padding:.25rem 1rem">`;
    if(!lista.length) html+=`<li class="muted">Nenhum registro ainda.</li>`;
    lista.forEach(c=>{
      html+=`<li><div style="flex:1"><div style="font-weight:500">${n(c.mm,1)} mm</div>
        <div class="muted">${(c.data||"").split("-").reverse().join("/")}${c.obs?" · "+esc(c.obs):""}</div></div>
        <button class="btn sm" data-edit="chuva" data-id="${c.id}">✎</button></li>`;
    });
    html+=`</ul>`;
  }

  if(page==="folgas"){
    if(!state.folgas) state.folgas=[];
    const tipos={X:"Folga",P:"Plantão incêndio",F:"Falta",T:"Trabalhado",V:"Férias",E:"Encerrou contrato"};
    html+=headerBar("Controle de equipe","Folgas e faltas",`<button class="btn primary sm" data-new="folga">+ Registrar</button>`);
    html+=`<p class="sub">Registre no celular e exporte para o computador (CSV).</p>`;
    html+=`<div style="padding:.25rem 1rem;display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" id="btn-exp-folgas">Exportar CSV</button></div>`;
    html+=`<div class="card"><p class="card-title">Legenda</p><p class="muted">X = Folga · P = Plantão de incêndio · F = Falta · T = Trabalhado · V = Férias</p></div>`;
    const lista=[...state.folgas].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    html+=`<ul class="list card" style="padding:.25rem 1rem">`;
    if(!lista.length) html+=`<li class="muted">Nenhum registro ainda.</li>`;
    lista.forEach(f=>{
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(f.pessoaNome||"—")}</div>
        <div class="muted">${esc(f.data||"")} · ${esc(tipos[f.tipo]||f.tipo)}${f.obs?" · "+esc(f.obs):""}</div></div>
        <span class="badge muted">${esc(f.tipo)}</span>
        <button class="btn sm" data-edit="folga" data-id="${f.id}">✎</button></li>`;
    });
    html+=`</ul>`;
  }

  if(page==="equatorial"){
    const eq = state.equatorial || SEED.equatorial;
    html+=headerBar("Energia · Equatorial / ENEL","Unidades",`<button class="btn primary sm" data-new="protocolo">+ Protocolo</button>`);
    html+=`<div class="card"><p class="card-title">Atendimento</p><p style="font-size:1.1rem;font-weight:500">${esc(eq.telefone)}</p>
      <p class="muted">Anote o protocolo após o atendimento.</p>
      <a class="btn primary block" style="margin-top:.6rem;text-align:center" href="tel:0800620196">Ligar 0800-620-196</a>
    </div>`;
    html+=`<p class="sec">Unidades consumidoras</p><ul class="list card" style="padding:.25rem 1rem">`;
    (eq.ucs||[]).forEach(u=>{
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(u.desc)}</div>
        <div class="muted">UC ${esc(u.uc)} · ${esc(u.unid)} · ${esc(u.titular)}</div></div>
        <button class="btn sm" data-copy="${esc(u.uc)}">Copiar UC</button></li>`;
    });
    html+=`</ul>`;
    html+=`<p class="sec">Protocolos</p>
      <div style="padding:0 1rem .5rem"><button class="btn" id="btn-exp-prot">Exportar protocolos CSV</button></div>
      <ul class="list card" style="padding:.25rem 1rem">`;
    const prots=[...(eq.protocolos||[])].slice().reverse();
    if(!prots.length) html+=`<li class="muted">Nenhum protocolo.</li>`;
    prots.forEach(p=>{
      html+=`<li><div style="flex:1"><div style="font-weight:500">${esc(p.protocolo||"—")}</div>
        <div class="muted">${esc(p.data||"")} ${esc(p.hora||"")} · UC ${esc(p.uc||"")}</div>
        <div class="muted">${esc(p.hist||"")} · ${esc(p.local||"")}</div></div></li>`;
    });
    html+=`</ul>`;
  }

  if(page==="mais"){
    html+=headerBar("CampoGestor","Mais");
    html+=`<div class="card"><p class="card-title">Conta e sincronização</p>
      <p class="muted" id="cloud-status">${cloudLabel()}</p>`;
    if(!sbUser){
      html+=`<div class="field"><label>E-mail</label><input id="auth-email" type="email" placeholder="seu@email.com" autocomplete="username"/></div>
        <div class="field"><label>Senha (mín. 6)</label><input id="auth-pass" type="password" placeholder="••••••" autocomplete="current-password"/></div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn primary" id="btn-login">Entrar</button>
          <button class="btn" id="btn-signup">Criar conta</button>
        </div>
        <p class="muted" style="margin-top:.5rem">Com login, celular e PC compartilham os mesmos dados.</p>`;
    } else {
      html+=`<p class="muted">E-mail: ${esc(sbUser.email||"")}</p>
        <button class="btn" id="btn-logout" style="margin-top:.5rem">Sair</button>
        <button class="btn" id="btn-push" style="margin-top:.5rem">Salvar na nuvem agora</button>
        <button class="btn" id="btn-pull" style="margin-top:.5rem">Buscar da nuvem</button>`;
    }
    html+=`</div>`;
    html+=`<div class="card"><p class="muted" style="text-transform:uppercase;letter-spacing:.06em;font-size:.7rem">Propriedade</p>
      <p style="font-family:var(--display);font-size:1.25rem;margin:.25rem 0">${esc(state.farm.nome)}</p>
      <p class="muted">${esc(state.farm.municipio)} · safra ${esc(state.farm.safra)} · ${ha(state.farm.areaTotal)}</p>
      <p class="muted">${esc(state.farm.cargo)} · Gerente: ${esc(state.farm.gerente)}</p>
      <button class="btn" style="margin-top:.75rem" data-edit="farm">Editar fazenda</button>
    </div>
    <div style="padding:.5rem 1rem;display:flex;flex-direction:column;gap:.5rem">
      <button class="btn block" data-go="safra">Abrir programação da safra</button>
      <button class="btn block" data-go="equatorial">Equatorial / energia (UCs)</button>
      <button class="btn block" data-go="folgas">Folgas, plantão e faltas</button>
      <button class="btn block" id="btn-reset">Restaurar dados da fazenda</button>
    </div>
    <p class="sub" style="margin-top:1rem;line-height:1.5">Pesquise e edite insumos, frota e pessoas nas abas. A safra 2026/27 vem do caderno de campo.</p>`;
  }

  const navItems=[
    {id:"hoje",ic:"🏠",label:"Hoje"},
    {id:"frota",ic:"🚜",label:"Frota"},
    {id:"estoque",ic:"📦",label:"Estoque"},
    {id:"pessoas",ic:"👥",label:"Pessoas"},
    {id:"safra",ic:"🌾",label:"Safra"},
    {id:"chuva",ic:"🌧️",label:"Chuva"},
    {id:"sementes",ic:"🌱",label:"Sementes"},
    {id:"folgas",ic:"📅",label:"Folgas"},
    {id:"equatorial",ic:"⚡",label:"Energia"},
    {id:"mais",ic:"⋯",label:"Mais"},
  ];
  html+=`<div class="side-bg ${menuOpen?"open":""}" id="side-bg"></div>`;
  html+=`<aside class="side ${menuOpen?"open":""}" id="side">
    <div class="brand"><div class="k">CampoGestor</div><div class="n">${esc(state.farm.nome)}</div></div>`;
  navItems.forEach(it=>{
    html+=`<button class="nav-item ${page===it.id?"active":""}" data-go="${it.id}"><span class="ic">${it.ic}</span><span>${it.label}</span></button>`;
  });
  html+=`</aside>`;
  html+=renderDrawer();
  root.innerHTML=html;
  bind();
  if(page==="hoje"){ notifyBirthdays(); notifyRotina(); }
}

function bind(){
  document.querySelectorAll("[data-go]").forEach(btn=>{ btn.onclick=()=>{ page=btn.getAttribute("data-go"); edit=null; menuOpen=false; render(); }; });
  document.querySelectorAll("[data-ver-pessoa]").forEach(el=>{
    el.onclick=()=>{ edit={kind:"ver-pessoa", id:el.getAttribute("data-ver-pessoa")}; render(); };
  });

  const bm=document.getElementById("btn-menu");
  if(bm) bm.onclick=()=>{ menuOpen=true; render(); };
  const sbg=document.getElementById("side-bg");
  if(sbg) sbg.onclick=()=>{ menuOpen=false; render(); };

  document.querySelectorAll("[data-rotina]").forEach(cb=>{ cb.onchange=()=>{ const id=cb.getAttribute("data-rotina"); const hoje=hojeISO();
    if(state.rotinaFeita[id]===hoje) delete state.rotinaFeita[id]; else state.rotinaFeita[id]=hoje; save(); render(); }; });
  document.querySelectorAll("[data-cat]").forEach(b=>{ b.onclick=()=>{ catInsumo=b.getAttribute("data-cat"); render(); }; });
  const qi=document.getElementById("q-insumo");
  if(qi){ qi.oninput=()=>{ qInsumo=qi.value; /* live filter without full redraw of input focus - debounce simple */ clearTimeout(qi._t); qi._t=setTimeout(()=>render(),200); };
    setTimeout(()=>{ const el=document.getElementById("q-insumo"); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0);
  }
  document.querySelectorAll("[data-edit]").forEach(b=>{ b.onclick=()=>{ openEdit(b.getAttribute("data-edit"), b.getAttribute("data-id")||null); }; });
  document.querySelectorAll("[data-new]").forEach(b=>{ b.onclick=()=>{ openEdit("novo-"+b.getAttribute("data-new"), null); }; });
  const dr=document.getElementById("drawer");
  if(dr) dr.onclick=(e)=>{ if(e.target===dr) closeEdit(); };

  const es=document.getElementById("e-save");
  if(es) es.onclick=()=>{
    if(edit.kind==="insumo"||edit.kind==="novo-insumo"){
      const row={ nome:document.getElementById("e-nome").value.trim(), categoria:document.getElementById("e-cat").value,
        tecnico:(document.getElementById("e-tec")&&document.getElementById("e-tec").value.trim())||"",
        tipoDef:(document.getElementById("e-tipodef")&&document.getElementById("e-tipodef").value.trim())||"",
        unidade:document.getElementById("e-un").value.trim()||"un", quantidade:Number(String(document.getElementById("e-qtd").value).replace(",",".")||0),
        minimo:0 };
      if(!row.nome){ toast("Informe o nome"); return; }
      if(edit.kind==="insumo"){ state.insumos=state.insumos.map(x=>x.id===edit.id?{...x,...row}:x); }
      else state.insumos.push({id:uid(),...row});
      save(); toast("Insumo salvo"); closeEdit(); return;
    }
    if(edit.kind==="maquina"||edit.kind==="novo-maquina"){
      const row={ nome:document.getElementById("e-nome").value.trim(), tipo:document.getElementById("e-tipo").value,
        modelo:document.getElementById("e-mod").value.trim(), placa:document.getElementById("e-placa").value.trim(), status:document.getElementById("e-st").value };
      if(!row.nome){ toast("Informe o nome"); return; }
      if(edit.kind==="maquina") state.maquinas=state.maquinas.map(x=>x.id===edit.id?{...x,...row}:x);
      else state.maquinas.push({id:uid(),...row});
      save(); toast("Máquina salva"); closeEdit(); return;
    }
    if(edit.kind==="semente"||edit.kind==="novo-semente"){
      if(!state.sementes) state.sementes=[];
      const row={ cultivar:document.getElementById("e-cult").value, lote:document.getElementById("e-lote").value.trim(),
        validade:document.getElementById("e-val").value||"", peso:document.getElementById("e-peso").value.trim(),
        fornecedor:document.getElementById("e-forn").value.trim(), numero:document.getElementById("e-num").value.trim(),
        pureza:document.getElementById("e-pur").value.trim(), germinacao:document.getElementById("e-ger").value.trim(),
        obs:document.getElementById("e-obs").value.trim(), data: new Date().toLocaleString("pt-BR") };
      if(edit.kind==="semente") state.sementes=state.sementes.map(x=>x.id===edit.id?{...x,...row}:x);
      else state.sementes.push({id:uid(),...row});
      save(); toast("Big bag registrado"); closeEdit(); return;
    }
    if(edit.kind==="pessoa"||edit.kind==="novo-pessoa"){
      const row={ nome:document.getElementById("e-nome").value.trim(), funcao:document.getElementById("e-fun").value.trim(),
        tipo:document.getElementById("e-tipo").value, nascimento:document.getElementById("e-nasc").value||null, admissao:document.getElementById("e-adm").value||null };
      if(!row.nome){ toast("Informe o nome"); return; }
      if(edit.kind==="pessoa") state.pessoas=state.pessoas.map(x=>x.id===edit.id?{...x,...row}:x);
      else state.pessoas.push({id:uid(),...row});
      save(); toast("Pessoa salva"); closeEdit(); return;
    }
    if(edit.kind==="chuva"||edit.kind==="novo-chuva"){
      if(!state.chuva) state.chuva=[];
      const row={ data:document.getElementById("e-data").value||hojeISO(), mm:Number(String(document.getElementById("e-mm").value).replace(",",".")||0), obs:document.getElementById("e-obs").value.trim() };
      if(!row.mm && row.mm!==0){ toast("Informe os mm"); return; }
      if(edit.kind==="chuva") state.chuva=state.chuva.map(x=>x.id===edit.id?{...x,...row}:x);
      else state.chuva.push({id:uid(),...row});
      save(); toast("Chuva registrada"); closeEdit(); return;
    }
    if(edit.kind==="saida"||edit.kind==="novo-saida"){
      if(!state.saidas) state.saidas=[];
      const prodId=document.getElementById("e-prod").value;
      const prod=state.insumos.find(x=>x.id===prodId);
      const qtd=Number(String(document.getElementById("e-qtd").value).replace(",",".")||0);
      if(!prod || !qtd){ toast("Selecione produto e quantidade"); return; }
      if(qtd > prod.quantidade){ toast("Quantidade maior que o estoque"); return; }
      const row={
        id:uid(),
        data:document.getElementById("e-data").value||hojeISO(),
        tipo:document.getElementById("e-tipo").value,
        itens:[{id:prod.id, nome:prod.nome, qtd, un:prod.unidade}],
        destino:document.getElementById("e-destino").value.trim(),
        responsavel:document.getElementById("e-resp").value.trim(),
        obs:document.getElementById("e-obs").value.trim(),
        devolvido:false
      };
      state.saidas.push(row);
      // baixa automática
      state.insumos=state.insumos.map(x=>x.id===prod.id?{...x, quantidade: Number((x.quantidade-qtd).toFixed(2))}:x);
      // sync diesel se for diesel
      if(prod.nome.toLowerCase().includes("diesel")){
        state.diesel.litros = Math.max(0, Number((state.diesel.litros - qtd).toFixed(0)));
      }
      save(); toast("Saída lançada e baixa no estoque"); closeEdit(); return;
    }
  };
  const ed=document.getElementById("e-del");
  if(ed) ed.onclick=()=>{
    if(!confirm("Excluir este registro?")) return;
    if(edit.kind==="insumo") state.insumos=state.insumos.filter(x=>x.id!==edit.id);
    if(edit.kind==="maquina") state.maquinas=state.maquinas.filter(x=>x.id!==edit.id);
    if(edit.kind==="pessoa") state.pessoas=state.pessoas.filter(x=>x.id!==edit.id);
    if(edit.kind==="chuva") state.chuva=(state.chuva||[]).filter(x=>x.id!==edit.id);
    save(); toast("Excluído"); closeEdit();
  };
  // Devolver empréstimo
  document.querySelectorAll("[data-devolver]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.getAttribute("data-devolver");
      const s=(state.saidas||[]).find(x=>x.id===id);
      if(!s || s.devolvido) return;
      (s.itens||[]).forEach(it=>{
        state.insumos=state.insumos.map(x=>x.id===it.id?{...x, quantidade: Number((x.quantidade+it.qtd).toFixed(2))}:x);
        if((it.nome||"").toLowerCase().includes("diesel")){
          state.diesel.litros = Number((state.diesel.litros + it.qtd).toFixed(0));
        }
      });
      s.devolvido=true;
      save(); toast("Empréstimo devolvido — estoque restaurado"); render();
    };
  });
  const ef=document.getElementById("e-save-farm");
  if(ef) ef.onclick=()=>{
    state.farm.nome=document.getElementById("f-nome").value.trim()||state.farm.nome;
    state.farm.municipio=document.getElementById("f-mun").value.trim()||state.farm.municipio;
    state.farm.cargo=document.getElementById("f-cargo").value.trim()||state.farm.cargo;
    state.farm.gerente=document.getElementById("f-ger").value.trim()||state.farm.gerente;
    state.farm.safra=document.getElementById("f-safra").value.trim()||state.farm.safra;
    save(); toast("Fazenda atualizada"); closeEdit();
  };
  const bn=document.getElementById("btn-notif");
  if(bn) bn.onclick=()=>{ if(!("Notification" in window)){ toast("Sem suporte a notificação"); return; }
    Notification.requestPermission().then(p=>{ if(p==="granted"){ toast("Avisos ativados"); new Notification("CampoGestor",{body:"Aniversários ativos"}); } else toast("Permissão negada"); }); };

  const bex=document.getElementById("btn-exp-folgas");
  if(bex) bex.onclick=()=>{
    const tipos={X:"Folga",P:"Plantão incêndio",F:"Falta",T:"Trabalhado",V:"Férias",E:"Encerrou"};
    const rows=[["Data","Pessoa","Tipo","Codigo","Observacao"]];
    (state.folgas||[]).forEach(f=>rows.push([f.data||"", f.pessoaNome||"", tipos[f.tipo]||f.tipo, f.tipo||"", f.obs||""]));
    exportCSV("folgas-santa-rita.csv", rows);
  };
  const bep=document.getElementById("btn-exp-prot");
  if(bep) bep.onclick=()=>{
    const eq=state.equatorial||SEED.equatorial;
    const rows=[["Data","Hora","UC","Protocolo","Ocorrencia","Local"]];
    (eq.protocolos||[]).forEach(p=>rows.push([p.data||"",p.hora||"",p.uc||"",p.protocolo||"",p.hist||"",p.local||""]));
    exportCSV("protocolos-equatorial.csv", rows);
  };
  document.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.getAttribute("data-copy")); toast("UC copiada"); }catch(e){ toast(b.getAttribute("data-copy")); } };
  });


  const bl=document.getElementById("btn-login");
  if(bl) bl.onclick=async()=>{
    const email=document.getElementById("auth-email").value.trim();
    const pass=document.getElementById("auth-pass").value;
    if(!email||!pass){ toast("Preencha e-mail e senha"); return; }
    try{ await sbLogin(email, pass); toast("Login ok — dados sincronizados"); render(); }
    catch(e){ toast(e.message||"Falha no login"); }
  };
  const bs=document.getElementById("btn-signup");
  if(bs) bs.onclick=async()=>{
    const email=document.getElementById("auth-email").value.trim();
    const pass=document.getElementById("auth-pass").value;
    if(!email||pass.length<6){ toast("Senha com pelo menos 6 caracteres"); return; }
    try{
      await sbSignup(email, pass);
      try { await sbLogin(email, pass); toast("Conta criada e logada"); }
      catch(e2){ toast("Conta criada — confirme o e-mail no Supabase ou tente Entrar"); }
      render();
    } catch(e){ toast(e.message||"Falha ao criar conta"); }
  };
  const bo=document.getElementById("btn-logout");
  if(bo) bo.onclick=async()=>{ await sbLogout(); toast("Saiu da conta"); render(); };
  const bp=document.getElementById("btn-push");
  if(bp) bp.onclick=async()=>{ await pushCloud(); toast(cloudStatus==="synced"?"Salvo na nuvem":"Erro ao salvar"); render(); };
  const bpull=document.getElementById("btn-pull");
  if(bpull) bpull.onclick=async()=>{ const ok=await pullCloud(); toast(ok?"Dados da nuvem carregados":"Nada na nuvem ou erro"); render(); };

  const br=document.getElementById("btn-reset");
  if(br) br.onclick=()=>{ state=JSON.parse(JSON.stringify(SEED)); state.rotinaFeita={}; save(); toast("Dados restaurados"); render(); };
}

initAuth().then(()=>render()).catch(()=>render());
</script>
</body>
</html>
